services:
  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dashboard:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AEGIS_DATA_DIR: /data
      AEGIS_REQUIRE_REDIS: "true"
      REDIS_HOST: redis
      AEGIS_ENABLE_DEMO_LAB: "false"
      AEGIS_CORS_ORIGINS: "http://127.0.0.1:5001,http://localhost:5001"
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - aegis-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777

  worker:
    build: .
    command: ["rq", "worker", "--url", "redis://redis:6379", "--path", "/app/app"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AEGIS_DATA_DIR: /data
      AEGIS_REQUIRE_REDIS: "true"
      REDIS_HOST: redis
      AEGIS_ENABLE_DEMO_LAB: "false"
    volumes:
      - aegis-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777

volumes:
  aegis-data:
  redis-data:
