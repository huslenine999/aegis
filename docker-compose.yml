services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      AEGIS_ENABLE_DEMO_LAB: "false"
      AEGIS_CORS_ORIGINS: "http://127.0.0.1:5001,http://localhost:5001"
    ports:
      - "5001:5001"
    volumes:
      - aegis-data:/home/aegis/.aegis

volumes:
  aegis-data:
