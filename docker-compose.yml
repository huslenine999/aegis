services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dashboard:
    image: ${AEGIS_IMAGE:-aegis-local:latest}
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-production}
      AEGIS_PUBLIC_URL: https://${AEGIS_DOMAIN}
      AEGIS_ADMIN_TOKEN: ${AEGIS_ADMIN_TOKEN:?Set AEGIS_ADMIN_TOKEN to at least 32 characters}
      AEGIS_SESSION_SECRET: ${AEGIS_SESSION_SECRET:?Set AEGIS_SESSION_SECRET to at least 32 characters}
      AEGIS_TOKEN_PEPPER: ${AEGIS_TOKEN_PEPPER:?Set AEGIS_TOKEN_PEPPER to at least 32 characters}
      AEGIS_AUDIT_HMAC_KEY: ${AEGIS_AUDIT_HMAC_KEY:?Set AEGIS_AUDIT_HMAC_KEY to at least 32 characters}
      AEGIS_SECURITY_PROFILE: ${AEGIS_SECURITY_PROFILE:-standard}
      AEGIS_BOOTSTRAP_ADMIN_USERNAME: ${AEGIS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AEGIS_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:-}
      AEGIS_SETUP_TOKEN: ${AEGIS_SETUP_TOKEN:-}
      AEGIS_ENCRYPTION_KEY: ${AEGIS_ENCRYPTION_KEY:?Set the credential encryption key}
      AEGIS_GITHUB_CLIENT_ID: ${AEGIS_GITHUB_CLIENT_ID:-}
      AEGIS_GITHUB_CLIENT_SECRET: ${AEGIS_GITHUB_CLIENT_SECRET:-}
      AEGIS_GITHUB_CALLBACK_URL: ${AEGIS_GITHUB_CALLBACK_URL:-}
      AEGIS_GITHUB_APP_ID: ${AEGIS_GITHUB_APP_ID:-}
      AEGIS_GITHUB_APP_PRIVATE_KEY_B64: ${AEGIS_GITHUB_APP_PRIVATE_KEY_B64:-}
      AEGIS_GITHUB_WEBHOOK_SECRET: ${AEGIS_GITHUB_WEBHOOK_SECRET:-}
      AEGIS_REQUIRE_AUTH: "true"
      AEGIS_METRICS_TOKEN: ${AEGIS_METRICS_TOKEN:?Set a metrics bearer token}
      AEGIS_ALLOWED_HOSTS: ${AEGIS_ALLOWED_HOSTS:?Set the public host allowlist}
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:?Set the HTTPS origin allowlist}
      AEGIS_DATA_DIR: /data
      AEGIS_REQUIRE_REDIS: "true"
      AEGIS_REQUIRE_WORKER: "true"
      AEGIS_REQUIRE_NOTIFIER: "true"
      AEGIS_MAX_UPLOAD_BYTES: ${AEGIS_MAX_UPLOAD_BYTES:-1048576}
      AEGIS_MAX_REQUEST_BYTES: ${AEGIS_MAX_REQUEST_BYTES:-1114112}
      AEGIS_ARTIFACT_RETENTION_DAYS: ${AEGIS_ARTIFACT_RETENTION_DAYS:-30}
      AEGIS_ARTIFACT_BACKEND: ${AEGIS_ARTIFACT_BACKEND:-local}
      AEGIS_S3_BUCKET: ${AEGIS_S3_BUCKET:-}
      AEGIS_S3_REGION: ${AEGIS_S3_REGION:-}
      AEGIS_S3_PREFIX: ${AEGIS_S3_PREFIX:-aegis}
      AEGIS_S3_ENDPOINT_URL: ${AEGIS_S3_ENDPOINT_URL:-}
      AEGIS_S3_KMS_KEY_ID: ${AEGIS_S3_KMS_KEY_ID:-}
      AEGIS_S3_OBJECT_LOCK_DAYS: ${AEGIS_S3_OBJECT_LOCK_DAYS:-0}
      AEGIS_OIDC_ISSUER: ${AEGIS_OIDC_ISSUER:-}
      AEGIS_OIDC_CLIENT_ID: ${AEGIS_OIDC_CLIENT_ID:-}
      AEGIS_OIDC_CLIENT_SECRET: ${AEGIS_OIDC_CLIENT_SECRET:-}
      AEGIS_OIDC_AUTO_PROVISION: ${AEGIS_OIDC_AUTO_PROVISION:-false}
      AEGIS_OIDC_TENANT_ID: ${AEGIS_OIDC_TENANT_ID:-1}
      AEGIS_OIDC_ROLE_CLAIM: ${AEGIS_OIDC_ROLE_CLAIM:-roles}
      AEGIS_OIDC_ROLE_MAPPING: ${AEGIS_OIDC_ROLE_MAPPING:-}
      AEGIS_SCAN_JOB_TIMEOUT_SECONDS: ${AEGIS_SCAN_JOB_TIMEOUT_SECONDS:-3600}
      AEGIS_SANDBOX_COMMAND_TIMEOUT_SECONDS: ${AEGIS_SANDBOX_COMMAND_TIMEOUT_SECONDS:-300}
      AEGIS_SCANNER_TIMEOUT_SECONDS: ${AEGIS_SCANNER_TIMEOUT_SECONDS:-300}
      AEGIS_SANDBOX_MAX_FILES: ${AEGIS_SANDBOX_MAX_FILES:-100000}
      AEGIS_SANDBOX_MAX_CONTEXT_BYTES: ${AEGIS_SANDBOX_MAX_CONTEXT_BYTES:-2147483648}
      AEGIS_LOGIN_FAILURE_LIMIT: ${AEGIS_LOGIN_FAILURE_LIMIT:-5}
      AEGIS_LOGIN_LOCKOUT_SECONDS: ${AEGIS_LOGIN_LOCKOUT_SECONDS:-900}
      AEGIS_RECENT_AUTH_SECONDS: ${AEGIS_RECENT_AUTH_SECONDS:-600}
      AEGIS_ALLOW_DEEP_SCANS: ${AEGIS_ALLOW_DEEP_SCANS:-false}
      AEGIS_ISOLATED_WORKER: ${AEGIS_ISOLATED_WORKER:-false}
      AEGIS_MULTI_TENANT: "false"
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      AEGIS_ENABLE_DEMO_LAB: "false"
      FORWARDED_ALLOW_IPS: 172.31.0.10
    expose:
      - "5001"
    volumes:
      - aegis-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777

  worker:
    image: ${AEGIS_IMAGE:-aegis-local:latest}
    build: .
    entrypoint: ["python", "-m", "app.worker_entrypoint"]
    command: ["--url", "redis://redis:6379/0", "--path", "/app/app"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEGIS_ENV: production
      AEGIS_PUBLIC_URL: https://${AEGIS_DOMAIN}
      AEGIS_ENCRYPTION_KEY: ${AEGIS_ENCRYPTION_KEY:?Set the credential encryption key}
      AEGIS_DATA_DIR: /data
      AEGIS_REQUIRE_REDIS: "true"
      AEGIS_REQUIRE_WORKER: "true"
      AEGIS_REQUIRE_NOTIFIER: "true"
      AEGIS_SKIP_EXTERNAL_SCANNERS: ${AEGIS_SKIP_EXTERNAL_SCANNERS:-false}
      AEGIS_ENABLE_SAFETY: ${AEGIS_ENABLE_SAFETY:-false}
      SAFETY_API_KEY: ${SAFETY_API_KEY:-}
      AEGIS_ARTIFACT_RETENTION_DAYS: ${AEGIS_ARTIFACT_RETENTION_DAYS:-30}
      AEGIS_ARTIFACT_BACKEND: ${AEGIS_ARTIFACT_BACKEND:-local}
      AEGIS_S3_BUCKET: ${AEGIS_S3_BUCKET:-}
      AEGIS_S3_REGION: ${AEGIS_S3_REGION:-}
      AEGIS_S3_PREFIX: ${AEGIS_S3_PREFIX:-aegis}
      AEGIS_S3_ENDPOINT_URL: ${AEGIS_S3_ENDPOINT_URL:-}
      AEGIS_S3_KMS_KEY_ID: ${AEGIS_S3_KMS_KEY_ID:-}
      AEGIS_S3_OBJECT_LOCK_DAYS: ${AEGIS_S3_OBJECT_LOCK_DAYS:-0}
      AEGIS_SCAN_JOB_TIMEOUT_SECONDS: ${AEGIS_SCAN_JOB_TIMEOUT_SECONDS:-3600}
      AEGIS_SANDBOX_COMMAND_TIMEOUT_SECONDS: ${AEGIS_SANDBOX_COMMAND_TIMEOUT_SECONDS:-300}
      AEGIS_SCANNER_TIMEOUT_SECONDS: ${AEGIS_SCANNER_TIMEOUT_SECONDS:-300}
      AEGIS_SANDBOX_MAX_FILES: ${AEGIS_SANDBOX_MAX_FILES:-100000}
      AEGIS_SANDBOX_MAX_CONTEXT_BYTES: ${AEGIS_SANDBOX_MAX_CONTEXT_BYTES:-2147483648}
      AEGIS_ALLOW_DEEP_SCANS: ${AEGIS_ALLOW_DEEP_SCANS:-false}
      AEGIS_ISOLATED_WORKER: ${AEGIS_ISOLATED_WORKER:-false}
      AEGIS_EVIDENCE_SIGNING_KEY: ${AEGIS_EVIDENCE_SIGNING_KEY:?Set a URL-safe base64 Ed25519 seed}
      AEGIS_GITHUB_APP_ID: ${AEGIS_GITHUB_APP_ID:-}
      AEGIS_GITHUB_APP_PRIVATE_KEY_B64: ${AEGIS_GITHUB_APP_PRIVATE_KEY_B64:-}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      AEGIS_ENABLE_DEMO_LAB: "false"
    volumes:
      - aegis-data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; from rq import Worker; connection=Redis.from_url(os.environ['REDIS_URL']); connection.ping(); assert any('default' in worker.queue_names() for worker in Worker.all(connection=connection))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  notifier:
    image: ${AEGIS_IMAGE:-aegis-local:latest}
    build: .
    entrypoint: ["python", "-m", "app.notifier_entrypoint"]
    command: ["--url", "redis://redis:6379/0", "--path", "/app/app", "notifications"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEGIS_ENV: production
      AEGIS_ENCRYPTION_KEY: ${AEGIS_ENCRYPTION_KEY:?Set the credential encryption key}
      AEGIS_SMTP_HOST: ${AEGIS_SMTP_HOST:-}
      AEGIS_SMTP_PORT: ${AEGIS_SMTP_PORT:-587}
      AEGIS_SMTP_USERNAME: ${AEGIS_SMTP_USERNAME:-}
      AEGIS_SMTP_PASSWORD: ${AEGIS_SMTP_PASSWORD:-}
      AEGIS_SMTP_FROM: ${AEGIS_SMTP_FROM:-}
      AEGIS_DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
    volumes:
      - aegis-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; from rq import Worker; connection=Redis.from_url(os.environ['REDIS_URL']); connection.ping(); assert any('notifications' in worker.queue_names() for worker in Worker.all(connection=connection))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  proxy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_started
    environment:
      AEGIS_DOMAIN: ${AEGIS_DOMAIN:?Set the public DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.31.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  aegis-data:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
