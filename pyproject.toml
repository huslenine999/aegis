[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-security-console"
version = "2.3.0"
description = "Aegis DevSecOps security console and CLI scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Khuslen Gan-Ochir" }
]
keywords = [
  "security",
  "devsecops",
  "sast",
  "sca",
  "waf",
  "scanner",
]
dependencies = [
  "Flask==3.1.3",
  "Werkzeug==3.1.8",
  "requests==2.34.2",
  "urllib3==2.7.0",
  "PyYAML==6.0.3",
  "Jinja2==3.1.6",
  "MarkupSafe==2.1.5",
  "ruff==0.15.17",
  "safety==3.8.1",
  "detect-secrets==1.5.0",
  "yara-python==4.5.0",
  "pipdeptree==2.35.3",
  "fastapi==0.138.1",
  "uvicorn==0.49.0",
  "redis==5.2.1",
  "rq==2.1.0",
  "python-multipart==0.0.31",
  "websockets==16.0",
  "psycopg[binary]==3.2.10",
  "cryptography==49.0.0",
]

[project.optional-dependencies]
scanner = [
  "semgrep==1.170.0",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.1.1",
  "pytest-timeout==2.3.1",
]

[project.scripts]
aegis = "app.cli:main"

[project.urls]
Homepage = "https://github.com/huslenine999/aegis"
Repository = "https://github.com/huslenine999/aegis"
Issues = "https://github.com/huslenine999/aegis/issues"

[tool.setuptools]
packages = ["app", "rules"]
py-modules = ["policy_engine"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "downloads/*"]
rules = ["*.yar", "*.yaml"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
files = [
  "app/auth.py",
  "app/cli.py",
  "app/database.py",
  "app/notifications.py",
  "app/projects.py",
  "app/scan_status.py",
  "app/security_middleware.py",
  "app/sandbox.py",
  "app/scanners.py",
  "app/main.py",
  "app/worker.py",
  "app/worker_entrypoint.py",
  "app/notifier_entrypoint.py",
  "policy_engine.py",
]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["E402"]
"app/main.py" = ["E402"]
