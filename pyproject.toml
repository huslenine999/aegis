[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-security-console"
version = "2.1.0"
description = "Aegis DevSecOps security console and CLI scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Khuslen Gan-Ochir" }
]
keywords = [
  "security",
  "devsecops",
  "sast",
  "sca",
  "waf",
  "scanner",
]
dependencies = [
  "Flask==3.1.3",
  "Werkzeug==3.1.8",
  "requests==2.34.2",
  "urllib3==2.7.0",
  "PyYAML==6.0.3",
  "Jinja2==3.1.6",
  "MarkupSafe==2.1.5",
  "ruff>=0.1.0",
  "safety==3.2.9",
  "detect-secrets==1.5.0",
  "yara-python==4.5.0",
  "pipdeptree==2.35.3",
  "semgrep==1.163.0",
  "fastapi==0.138.1",
  "uvicorn==0.49.0",
  "redis==5.2.1",
  "rq==2.1.0",
  "python-multipart==0.0.31",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.5.0",
  "pytest==8.1.1",
  "pytest-timeout==2.3.1",
]

[project.scripts]
aegis = "app.cli:main"

[project.urls]
Homepage = "https://github.com/huslenine999/aegis"
Repository = "https://github.com/huslenine999/aegis"
Issues = "https://github.com/huslenine999/aegis/issues"

[tool.setuptools]
packages = ["app", "rules"]
py-modules = ["policy_engine"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "downloads/*"]
rules = ["*.yar", "*.yaml"]
