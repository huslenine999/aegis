[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-security-console"
version = "2.4.0"
description = "Private, explainable release-security scanner and self-hosted workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Khuslen Gan-Ochir" }
]
keywords = [
  "security",
  "devsecops",
  "sast",
  "sca",
  "waf",
  "scanner",
]
dependencies = [
  "Flask==3.1.3",
  "Werkzeug==3.1.8",
  "requests==2.34.2",
  "urllib3==2.7.0",
  "PyYAML==6.0.3",
  "Jinja2==3.1.6",
  "MarkupSafe==2.1.5",
  "ruff==0.15.17",
  "detect-secrets==1.5.0",
  "yara-python==4.5.0",
  "pipdeptree==2.35.3",
  "fastapi==0.138.1",
  "uvicorn==0.49.0",
  "redis==5.2.1",
  "rq==2.1.0",
  "python-multipart==0.0.31",
  "websockets==16.0",
  "psycopg[binary]==3.2.10",
  "cryptography==50.0.0",
  "boto3==1.43.52",
  "PyJWT[crypto]==2.13.0",
]

[project.optional-dependencies]
scanner = [
  "checkov==3.1.0",
  "semgrep==1.172.0",
  "safety==3.8.1",
  # Checkov 3.1.0's CycloneDX adapter requires the 5.x model API.
  "cyclonedx-python-lib==5.2.0",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "pytest-timeout==2.3.1",
]

[project.scripts]
aegis = "app.cli:main"

[project.urls]
Homepage = "https://github.com/huslenine999/aegis"
Repository = "https://github.com/huslenine999/aegis"
Issues = "https://github.com/huslenine999/aegis/issues"

[tool.setuptools]
packages = ["app", "app.downloads", "app.static", "app.templates", "rules"]
py-modules = ["policy_engine"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "downloads/*"]
rules = ["*.yar", "*.yaml"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
files = [
  "app/auth.py",
  "app/cli.py",
  "app/database.py",
  "app/findings.py",
  "app/health_routes.py",
  "app/notifications.py",
  "app/oidc.py",
  "app/projects.py",
  "app/policies.py",
  "app/scan_status.py",
  "app/security_middleware.py",
  "app/sandbox.py",
  "app/scanners.py",
  "app/iac_scanner.py",
  "app/main.py",
  "app/config.py",
  "app/observability.py",
  "app/preflight.py",
  "app/scan_engine.py",
  "app/worker.py",
  "app/worker_entrypoint.py",
  "app/notifier_entrypoint.py",
  "policy_engine.py",
]

[tool.coverage.run]
# The suite invokes the CLI in child processes; line coverage keeps those
# subprocess data files compatible across the pytest-cov and CLI runtimes.
branch = false
source = [
  "app.observability",
  "app.preflight",
  "app.rate_limit",
  "app.scan_engine",
  "app.security_middleware",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["E402"]
"app/main.py" = ["E402"]
