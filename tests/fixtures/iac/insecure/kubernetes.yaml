---
apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
spec:
  containers:
    - name: app
      image: example/app:latest
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: insecure-service
spec:
  type: LoadBalancer
  selector:
    app: insecure
  ports:
    - port: 80
      targetPort: 8080
