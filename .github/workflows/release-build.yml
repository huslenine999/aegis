name: Release Build

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,scanner]"
          python -m pip check

      - name: Verify tag and package versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          tag_version = sys.argv[1].removeprefix("v")
          python_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          npm_version = json.loads(pathlib.Path("package.json").read_text())["version"]
          if tag_version != python_version or tag_version != npm_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version}, python={python_version}, npm={npm_version}"
              )
          PY

      - name: Run release tests
        run: |
          python -m compileall -q app policy_engine.py tests
          ruff check app policy_engine.py tests
          mypy
          pytest -q --timeout=60 --timeout-method=thread

      - name: Run scanner behavior benchmark
        run: python scripts/run_security_benchmark.py --output benchmark-results.json

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Validate wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          required = {
              "app/cli.py",
              "app/evidence.py",
              "app/worker_entrypoint.py",
              "app/notifier_entrypoint.py",
              "app/templates/index.html",
              "app/templates/landing.html",
              "app/templates/report_template.html",
              "app/static/enhanced-dashboard.css",
              "app/static/enhanced-dashboard.js",
              "policy_engine.py",
              "rules/semgrep_rules.yaml",
          }
          with zipfile.ZipFile(wheel) as archive:
              missing = required - set(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing required files: {sorted(missing)}")
          PY

      - name: Smoke-test wheel entry point
        shell: bash
        run: |
          python -m venv --system-site-packages /tmp/aegis-wheel-smoke
          /tmp/aegis-wheel-smoke/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          /tmp/aegis-wheel-smoke/bin/aegis version

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS

      - name: Attest wheel build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.whl

      - name: Upload release wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-${{ github.ref_name }}-wheel
          path: |
            dist/*.whl
            dist/SHA256SUMS
            benchmark-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload PyPI distributions
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Approve and Publish Python Package
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-release
      url: https://pypi.org/project/aegis-security-console/
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download attested Python distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1.14

  publish-container:
    name: Approve and Publish Container
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout attested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publish versioned container image
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --metadata-file build-metadata.json \
            --push .
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          metadata = json.load(open("build-metadata.json"))
          print(f"digest={metadata['containerimage.digest']}")
          PY

      - name: Attest published container digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
