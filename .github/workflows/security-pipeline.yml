name: Aegis CI

permissions:
  contents: read

concurrency:
  group: aegis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security-gate:
    name: Aegis Project Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout pushed project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: target
          persist-credentials: false

      - name: Checkout trusted Aegis scanner and policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: huslenine999/aegis
          ref: e292c60770bee621fb70ba07b71cc9f2a525ea1a
          path: trusted-aegis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install trusted Aegis revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./trusted-aegis

      - name: Run trusted Aegis approval scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p aegis-reports
          set +e
          aegis scan target \
            --no-docker \
            --strict \
            --timeout 120 \
            --output aegis-reports \
            --config trusted-aegis/aegis.yml \
            --fail-on medium,high,critical \
            --sarif \
            --json > aegis-reports/summary.json
          status=$?
          set -e

          cat aegis-reports/summary.json
          if ! python -m json.tool aegis-reports/summary.json >/dev/null; then
            echo "::error title=Aegis operational error::Scanner did not produce a valid JSON summary."
            status=2
          fi
          if [ -f aegis-reports/report.md ]; then
            cat aegis-reports/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload Aegis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-approval-reports
          path: aegis-reports/
          if-no-files-found: error

      - name: Upload Aegis SARIF
        if: always() && hashFiles('aegis-reports/aegis.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: aegis-reports/aegis.sarif

  validate:
    name: Validate CLI and Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip check

      - name: Python syntax check
        run: |
          python -m compileall -q app policy_engine.py tests

      - name: Critical lint checks
        run: |
          ruff check app/cli.py app/config.py policy_engine.py --select E9,F63,F7,F82

      - name: Validate Semgrep rules
        env:
          SEMGREP_LOG_FILE: /tmp/aegis-semgrep.log
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          semgrep scan \
            --metrics off \
            --disable-version-check \
            --config rules/semgrep_rules.yaml \
            --validate

      - name: Validate package metadata
        run: |
          node -e "const p=require('./package.json'); if (p.bin.aegis !== './bin/cli.js') process.exit(1)"
          python -m pip wheel . --no-deps --wheel-dir dist
          aegis version

      - name: Validate composite Action contract
        run: |
          pytest -q tests/test_action.py

      - name: CLI help checks
        run: |
          python app/cli.py --help
          python app/cli.py scan --help
          python app/cli.py version
          python app/cli.py doctor --json

      - name: Focused tests
        run: |
          pytest tests/test_cli.py tests/test_policy.py

      - name: Full non-Docker test suite
        run: |
          pytest -q --timeout=60 --timeout-method=thread

      - name: SARIF smoke scan
        run: |
          python app/cli.py scan . --config aegis.yml --fast --sarif --json
