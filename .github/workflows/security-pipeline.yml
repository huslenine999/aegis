name: Aegis CI

permissions:
  contents: read

concurrency:
  group: aegis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security-gate:
    name: Aegis Project Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout pushed project
        uses: actions/checkout@v6

      - name: Run Aegis approval scan
        uses: ./
        with:
          scan-target: .
          output-dir: aegis-reports
          no-docker: "true"
          config: aegis.yml
          sarif: "true"
          timeout: "120"
          fail-on: medium,high,critical

      - name: Upload Aegis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aegis-approval-reports
          path: aegis-reports/

      - name: Upload Aegis SARIF
        if: always() && hashFiles('aegis-reports/aegis.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: aegis-reports/aegis.sarif

  validate:
    name: Validate CLI and Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip check

      - name: Python syntax check
        run: |
          python -m compileall -q app policy_engine.py tests

      - name: Critical lint checks
        run: |
          ruff check app/cli.py app/config.py policy_engine.py --select E9,F63,F7,F82

      - name: Validate package metadata
        run: |
          node -e "const p=require('./package.json'); if (p.bin.aegis !== './bin/cli.js') process.exit(1)"
          python -m pip wheel . --no-deps --wheel-dir dist
          aegis version

      - name: Validate composite Action contract
        run: |
          pytest -q tests/test_action.py

      - name: CLI help checks
        run: |
          python app/cli.py --help
          python app/cli.py scan --help
          python app/cli.py version
          python app/cli.py doctor --json

      - name: Focused tests
        run: |
          pytest tests/test_cli.py tests/test_policy.py

      - name: Full non-Docker test suite
        run: |
          pytest -q --timeout=60 --timeout-method=thread

      - name: SARIF smoke scan
        run: |
          python app/cli.py scan . --config aegis.yml --fast --sarif --json
