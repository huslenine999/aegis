name: Aegis CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security-gate:
    name: Aegis Project Approval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed project
        uses: actions/checkout@v4

      - name: Run Aegis approval scan
        uses: ./
        with:
          scan-target: .
          output-dir: aegis-reports
          no-docker: "true"
          config: aegis.yml
          sarif: "true"
          timeout: "120"
          fail-on: medium,high,critical

      - name: Upload Aegis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-approval-reports
          path: aegis-reports/

      - name: Upload Aegis SARIF
        if: always() && hashFiles('aegis-reports/aegis.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aegis-reports/aegis.sarif

  validate:
    name: Validate CLI and Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Python syntax check
        run: |
          python -m py_compile app/cli.py policy_engine.py tests/test_cli.py

      - name: Validate package metadata
        run: |
          node -e "const p=require('./package.json'); if (p.bin.aegis !== './bin/cli.js') process.exit(1)"

      - name: CLI help checks
        run: |
          python app/cli.py --help
          python app/cli.py scan --help
          python app/cli.py version
          python app/cli.py doctor --json

      - name: Focused tests
        run: |
          pytest tests/test_cli.py tests/test_policy.py

      - name: Full non-Docker test suite
        run: |
          pytest -q --timeout=60 --timeout-method=thread

      - name: SARIF smoke scan
        run: |
          python app/cli.py scan . --config aegis.yml --fast --sarif --json
