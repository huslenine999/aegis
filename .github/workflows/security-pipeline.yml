name: Aegis CI

permissions:
  contents: read

concurrency:
  group: aegis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security-gate:
    name: Aegis Project Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout pushed project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: target
          persist-credentials: false

      - name: Checkout trusted Aegis scanner and policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: huslenine999/aegis
          ref: 1d60daa9efa001eb36716e5656db514f809b8b6d
          path: trusted-aegis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install trusted Aegis revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./trusted-aegis

      - name: Run trusted Aegis approval scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p aegis-reports
          cp trusted-aegis/aegis.yml target/.aegis-trusted.yml
          set +e
          aegis scan target/app \
            --fast \
            --strict \
            --timeout 120 \
            --output aegis-reports \
            --config target/.aegis-trusted.yml \
            --fail-on medium,high,critical \
            --sarif \
            --json > aegis-reports/summary.json
          status=$?
          set -e

          cat aegis-reports/summary.json
          if ! python -m json.tool aegis-reports/summary.json >/dev/null; then
            echo "::error title=Aegis operational error::Scanner did not produce a valid JSON summary."
            status=2
          fi
          if [ -f aegis-reports/report.md ]; then
            cat aegis-reports/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload Aegis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-approval-reports
          path: aegis-reports/
          if-no-files-found: error

      - name: Upload Aegis SARIF
        if: always() && hashFiles('aegis-reports/aegis.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: aegis-reports/aegis.sarif

  validate:
    name: Validate CLI and Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          uv sync --locked --extra dev --extra scanner
          uv pip check

      - name: Python syntax check
        run: |
          uv run --locked python -m compileall -q app policy_engine.py tests

      - name: Python lint and type checks
        run: |
          uv run --locked ruff check app policy_engine.py tests
          uv run --locked mypy

      - name: Validate Semgrep rules
        env:
          SEMGREP_LOG_FILE: /tmp/aegis-semgrep.log
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          uv run --locked semgrep scan \
            --metrics off \
            --disable-version-check \
            --config rules/semgrep_rules.yaml \
            --validate

      - name: Validate package metadata
        run: |
          node -e "const p=require('./package.json'); if (p.bin.aegis !== './bin/cli.js') process.exit(1)"
          uv run --locked python -m pip wheel . --no-deps --wheel-dir dist
          uv run --locked aegis version

      - name: Validate composite Action contract
        run: |
          uv run --locked pytest -q tests/test_action.py

      - name: CLI help checks
        run: |
          uv run --locked python -m app.cli --help
          uv run --locked python -m app.cli scan --help
          uv run --locked python -m app.cli version
          uv run --locked python -m app.cli doctor --json

      - name: Focused tests
        run: |
          uv run --locked pytest tests/test_cli.py tests/test_policy.py

      - name: Full non-Docker test suite
        run: |
          uv run --locked pytest -q --timeout=60 --timeout-method=thread \
            --cov=app.observability \
            --cov=app.preflight \
            --cov=app.rate_limit \
            --cov=app.scan_engine \
            --cov=app.security_middleware \
            --cov-report=term-missing

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser authentication and accessibility tests
        run: npm run test:e2e

      - name: SARIF smoke scan
        run: |
          uv run --locked python -m app.cli scan . --config aegis.yml --fast --sarif --json

  container-smoke:
    name: Production Container Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install integration test dependencies
        run: uv sync --locked --extra dev --extra scanner

      - name: Configure production smoke environment
        shell: bash
        run: |
          echo "AEGIS_ADMIN_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AEGIS_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AEGIS_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "AEGIS_ENCRYPTION_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          echo "AEGIS_TOKEN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AEGIS_AUDIT_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AEGIS_EVIDENCE_SIGNING_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          echo "AEGIS_METRICS_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "AEGIS_DOMAIN=localhost" >> "$GITHUB_ENV"
          echo "AEGIS_ALLOWED_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
          echo "AEGIS_CORS_ORIGINS=https://localhost" >> "$GITHUB_ENV"
          echo "AEGIS_SKIP_EXTERNAL_SCANNERS=true" >> "$GITHUB_ENV"

      - name: Configure CI Compose override
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            dashboard:
              ports:
                - "5001:5001"
          YAML

      - name: Validate and build Compose stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Start production stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres redis dashboard worker notifier

      - name: Verify readiness and worker scan
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5001/ready > /tmp/aegis-ready.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Aegis did not become ready."
              exit 1
            fi
            sleep 2
          done
          cat /tmp/aegis-ready.json
          curl --fail --silent http://localhost:5001/health
          curl --fail --silent \
            -H "Authorization: Bearer $AEGIS_METRICS_TOKEN" \
            http://localhost:5001/metrics

          job_id="$(
            curl --fail --silent \
              -H "X-Aegis-Token: $AEGIS_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"target":"secure"}' \
              http://localhost:5001/run-scan |
            python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])'
          )"
          for attempt in $(seq 1 60); do
            state="$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T redis redis-cli HGET "job:$job_id" state)"
            if [ "$state" = "completed" ]; then
              break
            fi
            if [ "$state" = "failed" ] || [ "$attempt" -eq 60 ]; then
              echo "Worker scan ended in state: ${state:-missing}"
              exit 1
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T dashboard test -f /data/scans/report.html
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T dashboard test -f /data/scans/report.md
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Run real Compose scan lifecycle integration
        env:
          AEGIS_COMPOSE_INTEGRATION: "1"
          AEGIS_INTEGRATION_BASE_URL: http://localhost:5001
        run: |
          uv run --locked pytest -q tests/integration/test_compose_scan_lifecycle.py tests/integration/test_compose_recovery.py

      - name: Show container logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color dashboard worker notifier postgres redis

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes
