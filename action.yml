name: 'Aegis Security Scan & Policy Gate'
description: 'Scans a pushed project with Aegis, publishes reports, and blocks the workflow when policy declines the project.'
author: 'Aegis'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  scan-target:
    description: 'Directory or file to scan'
    required: false
    default: '.'
  output-dir:
    description: 'Directory where Aegis writes JSON, Markdown, HTML, and SBOM reports'
    required: false
    default: 'aegis-reports'
  no-docker:
    description: 'Skip Docker sandbox, Trivy, and DAST checks'
    required: false
    default: 'true'
  timeout:
    description: 'Per-tool timeout in seconds'
    required: false
    default: '120'
  fail-on:
    description: 'Comma-separated severities that block supported scanner families, for example high,critical'
    required: false
    default: 'medium,high,critical'
  config:
    description: 'Optional path to an aegis.yml configuration file'
    required: false
    default: ''
  sarif:
    description: 'Write SARIF output in the report directory'
    required: false
    default: 'false'
outputs:
  decision:
    description: 'Aegis policy decision: approved or declined'
    value: ${{ steps.aegis.outputs.decision }}
  summary-json:
    description: 'Path to the machine-readable Aegis summary JSON'
    value: ${{ steps.aegis.outputs.summary-json }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Aegis scanner dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Create report directory
      shell: bash
      run: mkdir -p "${{ inputs.output-dir }}"

    - name: Run Aegis project approval gate
      id: aegis
      shell: bash
      run: |
        set +e
        TARGET="${{ inputs.scan-target }}"
        OUTPUT_DIR="${{ inputs.output-dir }}"
        DOCKER_FLAG=""
        if [ "${{ inputs.no-docker }}" = "true" ]; then
          DOCKER_FLAG="--no-docker"
        fi
        CONFIG_FLAG=""
        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_FLAG="--config ${{ inputs.config }}"
        fi
        SARIF_FLAG=""
        if [ "${{ inputs.sarif }}" = "true" ]; then
          SARIF_FLAG="--sarif"
        fi
        echo "[Aegis] Scanning pushed project: $TARGET"
        python "${{ github.action_path }}/app/cli.py" scan "$TARGET" \
          $DOCKER_FLAG \
          $CONFIG_FLAG \
          $SARIF_FLAG \
          --timeout "${{ inputs.timeout }}" \
          --output "$OUTPUT_DIR" \
          --fail-on "${{ inputs.fail-on }}" \
          --json > "$OUTPUT_DIR/summary.json"
        STATUS=$?
        cat "$OUTPUT_DIR/summary.json"
        if [ -f "$OUTPUT_DIR/report.md" ]; then
          cat "$OUTPUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$STATUS" -eq 0 ]; then
          echo "decision=approved" >> "$GITHUB_OUTPUT"
          echo "[Aegis] Project approved."
        else
          echo "decision=declined" >> "$GITHUB_OUTPUT"
          echo "[Aegis] Project declined."
        fi
        echo "summary-json=$OUTPUT_DIR/summary.json" >> "$GITHUB_OUTPUT"
        exit "$STATUS"
