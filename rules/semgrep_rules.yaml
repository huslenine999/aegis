rules:
  - id: python-sqli
    mode: taint
    pattern-sources:
      - pattern: input(...)
      - pattern: $REQUEST.query_params
      - pattern: $REQUEST.path_params
      - pattern: $REQUEST.form(...)
      - pattern: $REQUEST.json(...)
      # Flask and Django request data
      - pattern: flask.request.args
      - pattern: flask.request.form
      - pattern: flask.request.values
      - pattern: flask.request.get_json(...)
      - pattern: $REQUEST.GET
      - pattern: $REQUEST.POST
    pattern-sinks:
      - patterns:
          - pattern: $CURSOR.execute($QUERY, ...)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $CURSOR.executemany($QUERY, ...)
          - focus-metavariable: $QUERY
    message: "Untrusted request or input data reaches a database execution call. Use a parameterized query."
    languages: [python]
    severity: ERROR

  # A helper that builds SQL from its own parameter has no request source in
  # scope, so python-sqli cannot see the flow.
  - id: python-sql-string-from-parameter
    patterns:
      - pattern-inside: |
          def $F(..., $P, ...):
              ...
      - pattern-either:
          - pattern: $CALL("...".format(..., $P, ...), ...)
          - pattern: $CALL("..." % $P, ...)
          - pattern: $CALL("..." % (..., $P, ...), ...)
          - pattern: $CALL(f"...{$P}...", ...)
          - pattern: $CALL("..." + $P, ...)
          - patterns:
              - pattern: $CALL($Q, ...)
              - pattern-either:
                  - pattern-inside: |
                      $Q = "...".format(..., $P, ...)
                      ...
                  - pattern-inside: |
                      $Q = "..." % $P
                      ...
                  - pattern-inside: |
                      $Q = "..." % (..., $P, ...)
                      ...
                  - pattern-inside: |
                      $Q = f"...{$P}..."
                      ...
                  - pattern-inside: |
                      $Q = "..." + $P
                      ...
      - metavariable-regex:
          metavariable: $CALL
          regex: ^(.*\.)?(execute|executemany|executescript|raw|text|read_sql|read_sql_query)$
    message: "A SQL statement is built from a function parameter with string formatting. Pass values as bound parameters instead."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"

  - id: python-tainted-request
    mode: taint
    pattern-sources: &python-request-sources
      - pattern: $REQUEST.query_params
      - pattern: $REQUEST.path_params
      - pattern: $REQUEST.query
      - pattern: $REQUEST.match_info
      - pattern: $REQUEST.form(...)
      - pattern: $REQUEST.json(...)
      - pattern: flask.request.args
      - pattern: flask.request.form
      - pattern: flask.request.values
      - pattern: flask.request.view_args
      - pattern: flask.request.get_json(...)
      - pattern: $REQUEST.GET
      - pattern: $REQUEST.POST
      # Query and path parameters of a routed handler (FastAPI, Flask).
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $ARG, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $ARG=Depends(...), ...):
                  ...
          # The request object itself is not user input.
          - metavariable-regex:
              metavariable: $ARG
              regex: ^(?!(request|req|self|cls|response)$)
          - focus-metavariable: $ARG
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($ARG, ...)
              - pattern: os.remove($ARG)
              - pattern: os.unlink($ARG)
              - pattern: send_file($ARG, ...)
              - pattern: FileResponse($ARG, ...)
              - pattern: web.FileResponse($ARG, ...)
              - pattern: urllib.request.urlopen($ARG, ...)
              - pattern: redirect($ARG, ...)
              - pattern: RedirectResponse($ARG, ...)
              - pattern: HttpResponseRedirect($ARG, ...)
              - pattern: web.HTTPFound($ARG)
              - pattern: web.HTTPFound(..., location=$ARG, ...)
          - focus-metavariable: $ARG
      - patterns:
          - pattern: $CLIENT.$M($ARG, ...)
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^(requests|httpx|session|client|self\.session|self\.client)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|head|options|stream)$
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: url_for(...)
      - pattern: reverse(...)
      # A lookup in a constant table returns only values the program chose.
      - patterns:
          - pattern-either:
              - pattern: $TABLE.get(...)
              - pattern: $TABLE[...]
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
      # A prefix check against a computed base; a literal like "/" is bypassable.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X.startswith($BASE, ...)
              - pattern: $X.is_relative_to(...)
          - pattern-not: $X.startswith("...", ...)
          - focus-metavariable: $X
    message: "Request input reaches a file path, outbound URL, or redirect. Validate it against an allowlist (path traversal, SSRF, or open redirect risk)."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-22 / CWE-918 / CWE-601"

  - id: python-reflected-xss
    mode: taint
    pattern-sources: *python-request-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: HTMLResponse($ARG, ...)
              - pattern: Markup($ARG)
              - pattern: mark_safe($ARG)
              - pattern: render_template_string($ARG, ...)
          - focus-metavariable: $ARG
      # Other responses are HTML only when the string is built as markup.
      - patterns:
          - pattern-either:
              - pattern: return $ARG
              - pattern: make_response($ARG, ...)
              - pattern: HttpResponse($ARG, ...)
              - pattern: web.Response(..., text=$ARG, ...)
          - metavariable-regex:
              metavariable: $ARG
              regex: (?s).*<[A-Za-z/!]
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - pattern: escape(...)
      - pattern: html.escape(...)
      - pattern: conditional_escape(...)
      - pattern: format_html(...)
      - pattern: bleach.clean(...)
      - pattern: jsonify(...)
      - pattern: json.dumps(...)
      - pattern: render_template(...)
    message: "Request input is written into an HTML response without escaping. Escape it or render it through an autoescaping template."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-79: Cross-site Scripting"

  - id: python-rce
    patterns:
      - pattern-either:
          - patterns:
              - pattern: subprocess.$FN(..., shell=True, ...)
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(run|call|check_call|check_output|Popen|getoutput|getstatusoutput)$
          - pattern: os.system(...)
          - pattern: os.popen(...)
    message: "Detected command injection risk via subprocess/os.system with shell=True."
    languages: [python]
    severity: ERROR

  - id: python-eval
    pattern: eval(...)
    message: "Detected unsafe use of eval()."
    languages: [python]
    severity: ERROR

  - id: python-pickle
    pattern: pickle.loads(...)
    message: "Detected unsafe deserialization with pickle."
    languages: [python]
    severity: ERROR

  - id: python-weak-hash
    pattern: hashlib.md5(...)
    message: "Detected weak MD5 hashing algorithm. Use SHA-256 or SHA-512 instead."
    languages: [python]
    severity: WARNING

  # ---------------------------------------------------------------------------
  # JavaScript and TypeScript
  # ---------------------------------------------------------------------------
  - id: javascript-eval
    patterns:
      - pattern-either:
          - pattern: eval($CODE)
          - pattern: new Function(..., $CODE)
          - pattern: vm.runInNewContext($CODE, ...)
          - pattern: vm.runInThisContext($CODE, ...)
          - pattern: setTimeout("..." + $X, ...)
          - pattern: setTimeout($X + "...", ...)
          - pattern: setTimeout(`...${$X}...`, ...)
          - pattern: setInterval("..." + $X, ...)
          - pattern: setInterval($X + "...", ...)
          - pattern: setInterval(`...${$X}...`, ...)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")
      - pattern-not: vm.runInNewContext("...", ...)
      - pattern-not: vm.runInThisContext("...", ...)
    message: "Dynamic code is evaluated from a non-constant string. Remove eval-style execution or map input to a fixed set of functions."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Eval Injection"

  - id: javascript-command-injection
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $CP = require('child_process');
                      ...
                  - pattern-inside: |
                      import $CP from 'child_process';
                      ...
                  - pattern-inside: |
                      import * as $CP from 'child_process';
                      ...
                  - pattern-inside: |
                      $CP = require('node:child_process');
                      ...
                  - pattern-inside: |
                      import $CP from 'node:child_process';
                      ...
                  - pattern-inside: |
                      import * as $CP from 'node:child_process';
                      ...
              - pattern-either:
                  - pattern: $CP.exec($CMD, ...)
                  - pattern: $CP.execSync($CMD, ...)
                  - pattern: '$CP.spawn($CMD, $ARGS, {..., shell: true, ...})'
                  - pattern: '$CP.spawnSync($CMD, $ARGS, {..., shell: true, ...})'
          # const { exec } = require('child_process') binds no namespace object.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const {..., $FN, ...} = require('child_process');
                      ...
                  - pattern-inside: |
                      const {..., $FN, ...} = require('node:child_process');
                      ...
                  - pattern-inside: |
                      import {..., $FN, ...} from 'child_process';
                      ...
                  - pattern-inside: |
                      import {..., $FN, ...} from 'node:child_process';
                      ...
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(exec|execSync)$
              - pattern: $FN($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'
    message: "A shell command is built from a non-constant value. Use execFile/spawn with an argument array and no shell."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"

  - id: javascript-sql-injection
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD(`...${$X}...`, ...)
          - pattern: $DB.$METHOD("..." + $X, ...)
          - pattern: $DB.$METHOD($X + "...", ...)
          - pattern: |
              $SQL = `...${$X}...`;
              ...
              $DB.$METHOD($SQL, ...);
          - pattern: |
              $SQL = "..." + $X;
              ...
              $DB.$METHOD($SQL, ...);
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|execute|raw|\$queryRawUnsafe|\$executeRawUnsafe|unsafe|exec)$
      - metavariable-regex:
          metavariable: $DB
          regex: (?i)(db|database|conn|connection|client|pool|sequelize|knex|prisma|sql|pg|mysql|tx|trx|transaction)
    message: "A SQL query is built with string concatenation or interpolation. Pass values as bound parameters instead."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"

  - id: javascript-xss-html-sink
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $HTML
          - pattern: $EL.outerHTML = $HTML
          - pattern: $EL.insertAdjacentHTML($POS, $HTML)
          - pattern: document.write($HTML)
          - pattern: document.writeln($HTML)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: document.write("...")
      - pattern-not: $EL.innerHTML = $SANITIZER.sanitize(...)
      - pattern-not: $EL.innerHTML = $ESC(...)
      - metavariable-pattern:
          metavariable: $HTML
          patterns:
            # A template literal with no ${...} is a constant.
            - pattern-not-regex: ^`[^$]*`$
            - pattern-not-regex: (?i)(escape|sanitize|purify)
    message: "Non-constant HTML is written to the DOM. Use textContent, a DOM API, or a vetted sanitizer such as DOMPurify."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-79: Cross-site Scripting"

  - id: javascript-react-dangerously-set-inner-html
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{__html: $HTML}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} />'
      - metavariable-pattern:
          metavariable: $HTML
          patterns:
            - pattern-not-regex: (?i)(sanitize|purify)
    message: "Non-constant HTML is rendered with dangerouslySetInnerHTML. Sanitize it with a vetted library or render text instead."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-79: Cross-site Scripting"

  - id: javascript-express-tainted-request
    mode: taint
    pattern-sources: &express-request-sources
      - patterns:
          - pattern-either:
              - pattern-inside: function ($REQ, $RES, ...) { ... }
              - pattern-inside: ($REQ, $RES, ...) => { ... }
              - pattern-inside: async function ($REQ, $RES, ...) { ... }
              - pattern-inside: async ($REQ, $RES, ...) => { ... }
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.readFile($PATH, ...)
              - pattern: fs.readFileSync($PATH, ...)
              - pattern: fs.createReadStream($PATH, ...)
              - pattern: fs.writeFile($PATH, ...)
              - pattern: fs.writeFileSync($PATH, ...)
              - pattern: fs.unlink($PATH, ...)
              - pattern: fs.promises.readFile($PATH, ...)
              - pattern: $RES.sendFile($PATH, ...)
              - pattern: $RES.download($PATH, ...)
              - pattern: $RES.redirect($PATH)
              - pattern: axios.get($PATH, ...)
              - pattern: axios.post($PATH, ...)
              - pattern: axios($PATH, ...)
              - pattern: fetch($PATH, ...)
              - pattern: http.get($PATH, ...)
              - pattern: https.get($PATH, ...)
              - pattern: http.request($PATH, ...)
              - pattern: https.request($PATH, ...)
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: encodeURIComponent(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      # A lookup in a constant table returns only values the program chose.
      - patterns:
          - pattern-either:
              - pattern: $TABLE[...]
              - pattern: $TABLE.get(...)
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
      # A prefix check against a computed base; a literal like "/" is bypassable.
      - by-side-effect: true
        patterns:
          - pattern: $X.startsWith($BASE, ...)
          - pattern-not: $X.startsWith("...", ...)
          - focus-metavariable: $X
    message: "Request input reaches a file path, outbound URL, or redirect. Validate it against an allowlist (path traversal, SSRF, or open redirect risk)."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-22 / CWE-918 / CWE-601"

  - id: javascript-express-sql-injection
    mode: taint
    pattern-sources: *express-request-sources
    pattern-sinks:
      - patterns:
          - pattern: $DB.$METHOD($QUERY, ...)
          # The direct forms are javascript-sql-injection's.
          - pattern-not: $DB.$METHOD(`...${$X}...`, ...)
          - pattern-not: $DB.$METHOD("..." + $X, ...)
          - pattern-not: $DB.$METHOD($X + "...", ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(query|execute|raw|\$queryRawUnsafe|\$executeRawUnsafe|unsafe|exec)$
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)(db|database|conn|connection|client|pool|sequelize|knex|prisma|sql|pg|mysql|tx|trx|transaction)
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
    message: "Request input is concatenated into a SQL query. Pass values as bound parameters instead."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"

  - id: javascript-express-reflected-xss
    mode: taint
    pattern-sources: *express-request-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($ARG)
              - pattern: $RES.end($ARG)
              - pattern: $RES.write($ARG)
          - metavariable-regex:
              metavariable: $ARG
              regex: (?s).*<[A-Za-z/!]
          - focus-metavariable: $ARG
    pattern-sanitizers:
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex:
              metavariable: $ESCAPE
              regex: (?i).*(escape|sanitize|encode|purify)
    message: "Request input is written into an HTML response without escaping. Escape it or render it through an autoescaping template."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-79: Cross-site Scripting"

  - id: javascript-tls-verification-disabled
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
    message: "TLS certificate verification is disabled. Remove the override and trust the required CA instead."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"

  - id: javascript-unsafe-deserialization
    patterns:
      - pattern-either:
          - pattern-inside: |
              $S = require('node-serialize');
              ...
          - pattern-inside: |
              import $S from 'node-serialize';
              ...
      - pattern: $S.unserialize(...)
    message: "node-serialize can execute code embedded in the input. Use JSON.parse for untrusted data."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"

  - id: javascript-jwt-hardcoded-secret
    pattern-either:
      - pattern: $JWT.sign($PAYLOAD, "...", ...)
      - pattern: $JWT.verify($TOKEN, "...", ...)
    message: "A JWT is signed or verified with a hard-coded secret. Load the key from a secret store or environment."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"

  - id: javascript-weak-hash
    pattern-either:
      - pattern: $CRYPTO.createHash("md5")
      - pattern: $CRYPTO.createHash('md5')
    message: "Detected weak MD5 hashing algorithm. Use SHA-256 or stronger; for passwords use bcrypt, scrypt, or Argon2."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-328: Use of Weak Hash"

  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  - id: go-sql-injection
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD(fmt.Sprintf(...), ...)
          - pattern: $DB.$METHOD($CTX, fmt.Sprintf(...), ...)
          - pattern: $DB.$METHOD("..." + $X, ...)
          - pattern: $DB.$METHOD($CTX, "..." + $X, ...)
          - pattern: $DB.$METHOD($X + "...", ...)
          - pattern: $DB.$METHOD($CTX, $X + "...", ...)
          - pattern: |
              $SQL := fmt.Sprintf(...)
              ...
              $DB.$METHOD(..., $SQL, ...)
          - pattern: |
              $SQL := "..." + $X
              ...
              $DB.$METHOD(..., $SQL, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(Query|QueryRow|Exec|QueryContext|QueryRowContext|ExecContext|Prepare|PrepareContext|Raw)$
    message: "A SQL query is built with fmt.Sprintf or concatenation. Use placeholders and pass values as arguments."
    languages: [go]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"

  - id: go-command-injection
    patterns:
      - pattern-either:
          - pattern: exec.Command("$SHELL", "-c", $CMD, ...)
          - pattern: exec.CommandContext($CTX, "$SHELL", "-c", $CMD, ...)
      - metavariable-regex:
          metavariable: $SHELL
          regex: ^(sh|bash|zsh|/bin/sh|/bin/bash|cmd|cmd\.exe|powershell)$
      - pattern-not: exec.Command("$SHELL", "-c", "...", ...)
      - pattern-not: exec.CommandContext($CTX, "$SHELL", "-c", "...", ...)
    message: "A shell command is built from a non-constant value. Call the program directly with separate arguments."
    languages: [go]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"

  - id: go-tainted-request
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.Query()
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
      - pattern: mux.Vars(...)
      - pattern: ($C *gin.Context).Query(...)
      - pattern: ($C *gin.Context).Param(...)
      - pattern: ($C *gin.Context).PostForm(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.OpenFile($P, ...)
              - pattern: os.ReadFile($P)
              - pattern: ioutil.ReadFile($P)
              - pattern: os.Remove($P)
              - pattern: http.ServeFile($W, $REQ, $P)
              - pattern: http.Get($P)
              - pattern: http.Post($P, ...)
              - pattern: http.NewRequest($M, $P, ...)
              - pattern: http.NewRequestWithContext($CTX, $M, $P, ...)
              - pattern: http.Redirect($W, $REQ, $P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: strconv.Atoi(...)
      - pattern: url.QueryEscape(...)
    message: "Request input reaches a file path, outbound URL, or redirect. Validate it against an allowlist (path traversal, SSRF, or open redirect risk)."
    languages: [go]
    severity: ERROR
    metadata:
      cwe: "CWE-22 / CWE-918 / CWE-601"

  - id: go-tls-insecure-skip-verify
    pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
    message: "TLS certificate verification is disabled. Remove InsecureSkipVerify and configure the required root CAs."
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"

  - id: go-unescaped-template
    patterns:
      - pattern-either:
          - pattern: template.HTML($X)
          - pattern: template.JS($X)
          - pattern: template.URL($X)
      - pattern-not: template.HTML("...")
      - pattern-not: template.JS("...")
      - pattern-not: template.URL("...")
    message: "A non-constant value bypasses html/template escaping. Pass plain strings so the template escapes them."
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-79: Cross-site Scripting"

  - id: go-weak-hash
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
    message: "Detected weak MD5 hashing algorithm. Use SHA-256 or stronger; for passwords use bcrypt, scrypt, or Argon2."
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-328: Use of Weak Hash"

  # ---------------------------------------------------------------------------
  # Java
  # ---------------------------------------------------------------------------
  - id: java-sql-injection
    patterns:
      - pattern-either:
          - pattern: $STMT.$METHOD("..." + $X, ...)
          - pattern: $STMT.$METHOD($X + "...", ...)
          - pattern: $STMT.$METHOD(String.format(...), ...)
          - pattern: |
              String $SQL = "..." + $X;
              ...
              $STMT.$METHOD($SQL, ...);
          - pattern: |
              String $SQL = String.format(...);
              ...
              $STMT.$METHOD($SQL, ...);
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(executeQuery|executeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|queryForObject|queryForList|query|update)$
    message: "A SQL query is built with string concatenation or String.format. Use a PreparedStatement with ? placeholders."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"

  - id: java-command-injection
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: new ProcessBuilder("$SHELL", "-c", $CMD, ...)
      - pattern-not: Runtime.getRuntime().exec("...", ...)
      - pattern-not: new ProcessBuilder("$SHELL", "-c", "...", ...)
