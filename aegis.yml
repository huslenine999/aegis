scan:
  preset: standard
  fail_on: medium,high,critical
  timeout: 120
  sarif: aegis.sarif
  exclude_paths:
    - .env.aegis
    - app/demo_lab.py
    - app/scanners.py
    - app/templates/report_template.html
    - benchmarks/results
    - test-results
    - tests
  suppressions:
    - tool: Ruff
      rule: S104
      path: app/main.py
      reason: Development dashboard binds to all interfaces only when launched directly.
      approved_by: security-owner
      ticket: AEGIS-RISK-002
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S607
      path: app/sandbox.py
      reason: Docker CLI invocations intentionally use PATH discovery for local developer tooling.
      approved_by: security-owner
      ticket: AEGIS-RISK-003
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S310
      path: policy_engine.py
      reason: OSV vulnerability queries call a fixed HTTPS endpoint assembled by the scanner.
      approved_by: security-owner
      ticket: AEGIS-RISK-004
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S310
      path: app/cli_stack.py
      reason: CLI stack helper opens only locally generated report paths for developer convenience.
      approved_by: security-owner
      ticket: AEGIS-RISK-005
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S607
      path: app/worker.py
      reason: Worker intentionally invokes configured scanner executables from the runtime PATH.
      approved_by: security-owner
      ticket: AEGIS-RISK-006
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S608
      path: app/database.py
      reason: Migration trigger identifiers are selected only from hardcoded internal tuples; no request or configuration value enters the SQL text.
      approved_by: security-owner
      ticket: AEGIS-RISK-010
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S608
      path: app/findings.py
      reason: Finding filters and update columns are assembled only from fixed internal allowlists while every external value remains parameterized.
      approved_by: security-owner
      ticket: AEGIS-RISK-011
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S608
      path: app/finding_queries.py
      reason: Finding filters are assembled only from fixed internal clauses (code moved from app/findings.py under the same review) while every external value remains parameterized.
      approved_by: security-owner
      ticket: AEGIS-RISK-011
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S310
      path: scripts/pilot_readiness.py
      reason: The rehearsal client opens only the two hardcoded localhost health endpoints created by this script.
      approved_by: security-owner
      ticket: AEGIS-RISK-012
      expires_at: 2027-07-20
    - tool: Secrets
      rule: Hex High Entropy String
      path: .github/workflows/security-pipeline.yml
      reason: Reviewed immutable Git commit SHA for the trusted Aegis scanner revision.
      approved_by: security-owner
      ticket: AEGIS-RISK-007
      expires_at: 2027-07-20
    - tool: Secrets
      rule: Secret Keyword
      path: playwright.config.js
      reason: E2E test credentials are deterministic local-only fixtures scoped to the temporary test server.
      approved_by: security-owner
      ticket: AEGIS-RISK-008
      expires_at: 2027-07-20
    - tool: Secrets
      rule: Base64 High Entropy String
      path: app/bac_projects.py
      reason: The pinned development public key is public by design; its seed is published in app/evidence.py and it verifies only local demo bundles.
      approved_by: security-owner
      ticket: AEGIS-RISK-014
      expires_at: 2027-07-20
    - tool: YARA
      rule: Backdoor_Webshell
      path: app/cli.py
      reason: CLI scanner test fixture generation intentionally writes payload strings used to validate detections.
      approved_by: security-owner
      ticket: AEGIS-RISK-009
      expires_at: 2027-07-20
    - tool: Semgrep
      rule: javascript-xss-html-sink
      path: app/static/enhanced-dashboard.js
      reason: Dependency topology SVG is assembled from computed numeric coordinates, fixed class names, and escapeHtml() labels; no raw response text reaches innerHTML.
      approved_by: security-owner
      ticket: AEGIS-RISK-013
      expires_at: 2027-07-20
    - tool: Ruff
      rule: S607
      path: scripts/run_codeql_benchmark.py
      reason: Benchmark checkout runs git from the developer PATH on pinned, full-SHA public repositories.
      approved_by: security-owner
      ticket: AEGIS-RISK-015
      expires_at: 2027-07-20
    - tool: Secrets
      rule: Hex High Entropy String
      path: benchmarks/repositories-v1.json
      reason: Values are public git commit SHAs pinning the benchmark repositories; the file is a frozen inventory.
      approved_by: security-owner
      ticket: AEGIS-RISK-016
      expires_at: 2027-07-20
    - tool: OSV Dependency Audit
      rule: GHSA-84m7-p3x7-pcfv
      reason: mcp is installed only as a semgrep dependency (semgrep pins mcp==1.29.0; fixed in 1.30.0); Aegis never imports mcp or runs semgrep's MCP server. Remove once semgrep allows mcp>=1.30.
      approved_by: security-owner
      ticket: AEGIS-RISK-017
      expires_at: 2027-01-27
    - tool: OSV Dependency Audit
      rule: GHSA-5h93-6whr-6q8j
      reason: MCP client HTTP redirects; mcp is installed only as a semgrep dependency (semgrep pins mcp==1.29.0; fixed in 1.30.0). Aegis never imports mcp or runs semgrep's MCP client or server. Remove once semgrep allows mcp>=1.30.
      approved_by: security-owner
      ticket: AEGIS-RISK-019
      expires_at: 2027-01-27
    - tool: OSV Dependency Audit
      rule: GHSA-rwrf-2pqf-9j8j
      reason: MCP client outputSchema $ref fetch; mcp is installed only as a semgrep dependency (semgrep pins mcp==1.29.0; fixed in 1.30.0). Aegis never imports mcp or runs semgrep's MCP client or server. Remove once semgrep allows mcp>=1.30.
      approved_by: security-owner
      ticket: AEGIS-RISK-020
      expires_at: 2027-01-27
    - tool: OSV Dependency Audit
      rule: GHSA-w4fh-qvv9-3v23
      reason: MCP server bearer audience check; mcp is installed only as a semgrep dependency (semgrep pins mcp==1.29.0; fixed in 1.30.0). Aegis never imports mcp or runs semgrep's MCP client or server. Remove once semgrep allows mcp>=1.30.
      approved_by: security-owner
      ticket: AEGIS-RISK-021
      expires_at: 2027-01-27
    - tool: OSV Dependency Audit
      rule: GHSA-xcq7-p3pf-p88h
      reason: opentelemetry-api is installed only as a semgrep dependency (semgrep requires ~=1.37.0); Aegis does not parse tracestate from untrusted input. Remove once semgrep allows a fixed release.
      approved_by: security-owner
      ticket: AEGIS-RISK-018
      expires_at: 2027-01-27
